[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coffeetrain"
version = "0.1.0"
description = "Lightweight event-driven PyTorch trainer with composable callbacks"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Paul English"}]
license = {text = "Apache-2.0"}
keywords = ["pytorch", "training", "callbacks", "ml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "tqdm",
  "torchmetrics>=1.8.2",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.18.0"]
comet = ["comet-ml"]
optimi = ["torch-optimi"]

[project.urls]
Repository = "https://github.com/paul-english/coffeetrain"

[dependency-groups]
dev = [
  "ruff>=0.13.0",
  "pytest>=9.0.2",
  "pytest-timeout>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coffeetrain"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
